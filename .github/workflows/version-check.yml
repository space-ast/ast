name: 版本号一致性

on:
  pull_request:
  push:
    branches:
      - '**'  # 仅分支推送触发，忽略 tag 推送
  workflow_dispatch:  # 手动触发

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-version-check
  cancel-in-progress: true

jobs:
  version-check:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 只读 xmake.lua 与 xmake.sh，不用拉子模块
          submodules: false

      - name: 检查 xmake.lua 与 xmake.sh 的版本号
        run: bash scripts/ci/check-version.sh
