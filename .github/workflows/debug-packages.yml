name: 调试第三方包安装

on:
  push:
    branches:
      - ci-debug-pkg
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-22.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    defaults:
      run:
        shell: bash
    env:
      XMAKE_ROOT: y
    steps:
      - uses: actions/checkout@v4

      - name: 配置系统依赖（与 build.yml 一致）
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            zip unzip xz tar which git curl wget \
            binutils make pkgconf-pkg-config \
            mesa-libGL-devel mesa-libGLU-devel \
            libX11-devel libXext-devel libXrender-devel libXrandr-devel libXfixes-devel \
            libXi-devel libXcursor-devel libXinerama-devel libXScrnSaver-devel \
            libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel \
            fontconfig-devel freetype-devel libpng-devel \
            glib2-devel dbus-devel alsa-lib-devel libSM-devel libICE-devel \
            openssl-devel perl-IPC-Cmd perl-IPC-Run perl-Time-Piece

      - name: 环境信息
        run: |
          echo "=== gcc ==="; gcc --version | head -n 1
          echo "=== cmake ==="; which -a cmake || true; cmake --version 2>/dev/null | head -n 1 || true
          echo "=== perl ==="; perl -v | sed -n '2p'
          echo "=== openssl 头/库 ==="
          pkg-config --modversion openssl 2>/dev/null || true
          grep -m1 OPENSSL_VERSION_TEXT /usr/include/openssl/opensslv.h 2>/dev/null || true
          ls -l /usr/lib64/libssl.so* /usr/local/lib64/libssl.so* 2>/dev/null || true
          echo "=== 环境变量 ==="
          env | grep -E '^(PATH|LD_LIBRARY_PATH|LIBRARY_PATH|CPATH|CFLAGS|CXXFLAGS|CPPFLAGS)=' || true

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev

      - name: 安装并编译探针工程
        run: |
          rm -rf /tmp/probe-net && mkdir -p /tmp/probe-net
          cp _ci_debug/xmake.lua _ci_debug/probe.cpp _ci_debug/glibc_compat.c /tmp/probe-net/
          cd /tmp/probe-net
          set +e
          xmake f -cy -m release -a x86_64 -vD > debug-config.log 2>&1
          echo "=== xmake f exit: $? ==="
          xmake -y -vD > debug-build.log 2>&1
          echo "=== xmake build exit: $? ==="
          echo "=== openssl3 来源 ==="
          grep -a -E "checking for xmake-repo::openssl3|install openssl3|system::openssl" debug-config.log | sed 's/\x1b\[[0-9;]*m//g'
          echo "=== 错误 ==="
          grep -a -E "error:|CMake Error|install .* failed" debug-config.log debug-build.log | sed 's/\x1b\[[0-9;]*m//g' | head -n 40
          echo "=== Configure 上下文 ==="
          grep -a -n -E "Can't locate|BEGIN failed|@INC|No such file|Configure" debug-config.log | sed 's/\x1b\[[0-9;]*m//g' | tail -n 20
          line=$(grep -a -n "execv(./Configure" debug-config.log | head -n 1 | cut -d: -f1)
          if [ -n "$line" ]; then
            start=$((line > 25 ? line - 25 : 1))
            sed -n "${start},${line}p" debug-config.log | sed 's/\x1b\[[0-9;]*m//g'
          fi
          echo "=== 产物 ==="
          ls -l build/linux/x86_64/release/ 2>/dev/null
          echo "=== 动态库依赖 ==="
          readelf -d build/linux/x86_64/release/libprobe-net.so 2>/dev/null | grep NEEDED
          echo "=== 最高 GLIBC 符号版本 ==="
          objdump -T build/linux/x86_64/release/libprobe-net.so 2>/dev/null | grep -oE 'GLIBC_[0-9.]+' | sort -V | tail -n 5
          echo "=== 2.24+ 符号 ==="
          objdump -T build/linux/x86_64/release/libprobe-net.so 2>/dev/null | grep -E 'GLIBC_2\.(2[4-9]|[3-9])' | sed 's/^.*GLIBC/GLIBC/' | sort | uniq -c | sort -rn | head -n 30

      - name: 上传详细日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-packages-log
          path: _ci_debug/*.log

  # 在 glibc 2.28 上编译一个只有 getentropy 弱引用的 .so
  weak-version:
    runs-on: ubuntu-22.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: 编译弱引用探针
        run: |
          ldd --version | head -n 1
          cat > weakness.c <<'EOF'
          #include <stddef.h>
          extern int getentropy(void *buffer, size_t length) __attribute__((weak));
          int call_getentropy(void *buffer, size_t length)
          {
              return getentropy != NULL ? getentropy(buffer, length) : -7;
          }
          EOF
          gcc -shared -fPIC -O2 weakness.c -o libweakness.so
          echo "=== 动态符号（注意 weak 标记）==="
          readelf --dyn-syms libweakness.so | grep -i getentropy || true
          echo "=== Version needs ==="
          readelf --version-info libweakness.so
      - uses: actions/upload-artifact@v4
        with:
          name: weak-so
          path: libweakness.so

  # 在 glibc 2.17（manylinux2014）上真正 dlopen 它
  weak-load-old-glibc:
    needs: weak-version
    runs-on: ubuntu-22.04
    container:
      image: quay.io/pypa/manylinux2014_x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: weak-so
      - name: 在 glibc 2.17 上 dlopen
        run: |
          ldd --version | head -n 1
          cat > load.c <<'EOF'
          #include <dlfcn.h>
          #include <stdio.h>

          int main(void)
          {
              void *handle = dlopen("./libweakness.so", RTLD_NOW);
              if (handle == NULL) {
                  printf("dlopen failed: %s\n", dlerror());
                  return 1;
              }
              int (*fn)(void *, unsigned long) = (int (*)(void *, unsigned long))dlsym(handle, "call_getentropy");
              char buf[16];
              printf("dlopen ok, call_getentropy() = %d\n", fn ? fn(buf, sizeof(buf)) : -999);
              return 0;
          }
          EOF
          gcc load.c -o load -ldl
          set +e
          ./load
          echo "exit=$?"
