name: 标签与发布

on:
  push:
    branches:
      - master
    paths:
      - 'xmake.lua'

permissions:
  contents: write

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          # 只读 xmake.lua + 查远端 tag，不需要本地历史
          fetch-depth: 1

      - name: 提取版本号
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^[[:space:]]*set_version("\([0-9]\+\.[0-9]\+\(\.[0-9]\+\)\?\)".*/\1/p' xmake.lua | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::无法从 xmake.lua 中提取版本号"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "已提取版本号: $VERSION → 标签: v$VERSION"

      - name: 检查标签是否已存在
        id: check_tag
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          # 查远端而不是本地：浅克隆里没有 tag 对象, rev-parse 会永远判成不存在。
          # ls-remote 的模式是前缀匹配(refs/tags/v0.3.1 会命中 v0.3.10 / v0.3.1-rc1),
          # 所以取出 ref 名再用 -qxF 做整行精确比较。
          if git ls-remote --tags --refs origin "refs/tags/$TAG" \
               | awk '{print $2}' | grep -qxF "refs/tags/$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "标签 $TAG 已存在，跳过创建"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建标签与发布
        if: steps.check_tag.outputs.exists == 'false'
        env:
          # 必须使用 PAT 而非 GITHUB_TOKEN，否则无法触发下游的 release:published 事件
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --target "${{ github.sha }}"
          echo "标签与发布 $TAG 已创建"
