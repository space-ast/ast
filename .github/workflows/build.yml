name: 编译

on:
  pull_request:
  push:
    branches:
      - '**'  # 仅分支推送触发，忽略 tag 推送（tag 和 release:published 会出现并发组冲突）
  release:
    types: [published]
  workflow_dispatch:  # 手动触发，便于不推 master 也能验证构建与打包

permissions:
  # 推 nightly tag、上传 release 资产需要；显式声明，不依赖仓库默认权限设置
  contents: write

jobs:
  # 把 nightly 判定从各构建腿里抽出来只跑一次：它跟平台无关，放在 matrix 里会被 5 条腿
  # 重复执行，而且各自去改 nightly tag 本身就是竞态。
  nightly-guard:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.guard.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 需要 git ls-remote 与 tag 操作
          fetch-depth: 0

      - name: 检查 nightly 可否更新
        id: guard
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "非 master 分支($GITHUB_REF)，不更新 nightly"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA="${{ github.sha }}"
          # 只允许"仍然是 master 顶端"的提交更新 nightly。
          # 重跑旧的 run 时 github.sha 仍是那次 push 的旧提交，直接推会把 nightly 打回去。
          # 用 ls-remote 比对远端顶端，不依赖本地历史。
          TIP="$(git ls-remote origin refs/heads/master 2>/dev/null || true)"
          TIP="${TIP%%[[:space:]]*}"
          echo "TIP=$TIP"
          echo "SHA=$SHA"
          if [ -z "$TIP" ]; then
            echo "::warning::取不到远端 master 顶端(ls-remote 失败)，跳过 nightly 更新"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ "$TIP" = "$SHA" ]; then
            echo "master 顶端即本次提交，允许更新 nightly"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::本次提交 $SHA 不是 master 当前顶端 $TIP(疑似重跑旧 run, 或构建期间已有新推送)，跳过 nightly 更新，避免回退"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 更新 nightly tag
        if: steps.guard.outputs.ok == 'true'
        shell: bash
        run: |
          git tag -f nightly "${{ github.sha }}"
          git push -f origin nightly

  build-windows:
    needs: nightly-guard
    # guard 自身失败不该挡住构建（nightly 与否由它的 outputs 决定）；但被取消时不必再跑
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, arm64, x86]
    runs-on: windows-2022
    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-windows-${{ matrix.arch }}-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history for git tag operations
          fetch-depth: 0
          submodules: true
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          # this is not supported, use dev branch instead
          # xmake-version: local#
          xmake-version: branch@dev

      # Cache xmake dependencies
      - name: 配置依赖缓存
        uses: actions/cache@v4
        with:
          path: xmake-cache
          key: build-windows-2022-${{ matrix.arch }}-xmake-cache-v2

      # Cache build directory
      - name: 配置编译缓存
        if: github.event.action != 'published' && github.ref != 'refs/heads/master'
        uses: actions/cache@v4
        with:
          path: |
            build
            .xmake
          key: build-windows-2022-${{ matrix.arch }}-build-v2-${{ github.sha }}
          restore-keys: |
            build-windows-2022-${{ matrix.arch }}-build-v2-

      - name: 设置xmake相关目录
        run: |
          xmake g --pkg_cachedir=$(pwd)/xmake-cache/cache
          xmake g --pkg_installdir=$(pwd)/xmake-cache/packages
          xmake repo -u

      # arm64 上拿不到 Qt
      - name: 配置Qt环境
        if: matrix.arch != 'arm64'
        run: |
          xrepo install -y aqt
          xrepo info aqt
          xmake require -y qt

      - name: 配置debug版本
        run: |
          xmake f -cy --with_test=y -m debug -a ${{ matrix.arch }}

      - name: 编译debug版本
        run: |
          xmake -ay

      - name: 配置release版本
        run: |
          xmake f -cy --with_test=y -m release -a ${{ matrix.arch }}

      - name: 编译release版本
        run: |
          xmake -ay

      - name: 打包二进制包
        run: |
          xmake f -cy --with_test=y -m release -a ${{ matrix.arch }}
          xmake pack -y -f zip -o artifacts/ --basename=SpaceAST

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SpaceAST-windows-${{ matrix.arch }}
          path: artifacts/

      - name: 发布产物-二进制包
        if: github.event.action == 'published'
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: artifacts/SpaceAST.zip
          asset_name: SpaceAST-${{ github.event.release.tag_name }}-windows-${{ matrix.arch }}.zip
          asset_content_type: application/zip

      - name: 更新预发布-二进制包
        if: needs.nightly-guard.outputs.ok == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/SpaceAST.zip
          asset_name: SpaceAST-nightly-windows-${{ matrix.arch }}.zip
          tag: nightly
          overwrite: true
          prerelease: true
          release_name: Nightly Build-预发布版

  # Linux 在 manylinux_2_28 容器里构建：AlmaLinux 8 + glibc 2.28。
  #
  # 为什么不用 ubuntu runner 直接编：runner 镜像决定产物的 glibc 下限。ubuntu-22.04 是
  # glibc 2.35，编出来的库在 Ubuntu 20.04 / Debian 11 / RHEL 8、9 上一律加载失败。
  # manylinux_2_28 的 glibc 2.28 同时也是 job 级 container 能跑 Node 24 actions 的底线
  # （再老，checkout / cache / upload-artifact 会直接 GLIBC_2.28 not found）。要用
  # glibc ≤2.23 的镜像就得放弃 job 级 container，代价远大于改源码，故只把容器当"构建环境"，
  # 产物的实际基线由源码和下面那道门禁保证 —— 现在实测能到 glibc 2.14 / GLIBCXX 3.4.21，
  # 覆盖银河麒麟 V4，见 docs/guide/quickstart.md。
  build-linux:
    needs: nightly-guard
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            image: manylinux_2_28_x86_64
            arch: x86_64
          - runner: ubuntu-22.04-arm
            image: manylinux_2_28_aarch64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/pypa/${{ matrix.image }}
    defaults:
      run:
        shell: bash
    env:
      # 容器里以 root 运行，xmake 默认拒绝工作
      # （error: Running xmake as root is extremely dangerous and no longer supported.）
      XMAKE_ROOT: y
    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-linux-${{ matrix.arch }}-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history for git tag operations
          fetch-depth: 0
          submodules: true

      # 容器镜像很干净：Qt 链接期的 X11/字体/GL 依赖，以及打包要用的 zip，都得自己装。
      # 注意 zip 不在 manylinux 默认包里，缺了 xmake pack -f zip 会报
      # "no archiver(like zip, ...) found"。
      - name: 配置系统依赖
        run: |
          set -euo pipefail
          echo "=== 编译器 ==="
          which -a gcc g++ ld ar ranlib 2>/dev/null || true
          gcc --version | head -n 1
          echo "=== CPU 基线（镜像在 /usr/local/bin 放了强制 -march=x86-64 的包装脚本）==="
          echo | gcc -S -x c -o /dev/null -v - 2>&1 | grep -o 'march=[^ ]*' || true
          echo "=== 关键环境变量 ==="
          env | grep -E '^(PATH|LD_LIBRARY_PATH|LIBRARY_PATH|CPATH)=' || true
          echo "=== 工具链自带的 libstdc++ 版本上限 ==="
          readelf --version-info /usr/lib64/libstdc++.so.6 2>/dev/null \
            | grep -oE 'GLIBCXX_[0-9.]+' | sort -V | tail -n 1 || true

          dnf install -y --setopt=install_weak_deps=False \
            zip unzip xz tar which git curl wget \
            binutils make pkgconf-pkg-config \
            mesa-libGL-devel mesa-libGLU-devel \
            libX11-devel libXext-devel libXrender-devel libXrandr-devel libXfixes-devel \
            libXi-devel libXcursor-devel libXinerama-devel libXScrnSaver-devel \
            libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel \
            fontconfig-devel freetype-devel libpng-devel \
            glib2-devel dbus-devel alsa-lib-devel libSM-devel libICE-devel \
            openssl-devel

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev

      # 缓存 key 按镜像隔离，且 restore-keys 也用同一个前缀：绝不能捞到旧 ubuntu 腿的
      # build/——那些对象文件是别的 GCC 编的，看着能复用，链接出来却带着上一代工具链
      # 的符号版本需求。
      # 键里必须带上「从本仓源码现场编译」的那几个包的内容哈希：matplot++、QWT、Ipopt、
      # libf2c、OpenFrames、Qt-Advanced-Docking、cspice 都是 set_sourcedir 到 thirdparty/
      # 子模块的。xmake 只看「包装好没有」、不看源码变没变 —— 键里不带哈希的话，改了
      # vendored 源码它照样复用旧产物，修复会静默失效。这不是假设：matplot++ 的
      # powf@GLIBC_2.27 修复就这么白丢过一轮，源码改成乘法了、产物里的符号纹丝不动。
      # 用 thirdparty/** 而不是逐个列举，是为了新加从子模块取源码的包时自动覆盖。
      # 注意这**不是**唯一要改的地方：set_sourcedir 的包落在 build/.packages（不是
      # xmake-cache/packages，那里只有 7z/python/aqt 这类 URL 包），所以下面的编译缓存
      # 也必须带上同一份哈希，否则包照样随 build/ 被旧提交捞回来。
      - name: 配置依赖缓存
        uses: actions/cache@v4
        with:
          path: xmake-cache
          key: xmake-deps-${{ matrix.image }}-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-v1

      # 编译缓存的键同样要带第三方源码哈希，restore-keys 的前缀也必须带 ——
      # `build/` 这棵树里不止有项目自己的目标文件，还混着从包收集来的第三方 .so
      # （libmatplot.so / libqwt.so 等）。只按 `xmake-build-<image>-v1-` 前缀回捞的话，
      # 会把上一个提交（乃至更早）留下的第三方库一起捞回来，打包时用的是那份旧库，
      # 改 vendored 源码照样不见效。带上哈希后就只有第三方没动时才复用。
      - name: 配置编译缓存
        if: github.event.action != 'published' && github.ref != 'refs/heads/master'
        uses: actions/cache@v4
        with:
          path: |
            build
            .xmake
          key: xmake-build-${{ matrix.image }}-v1-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-${{ github.sha }}
          restore-keys: |
            xmake-build-${{ matrix.image }}-v1-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-

      - name: 设置xmake相关目录
        run: |
          set -euo pipefail
          xmake g --pkg_cachedir="$(pwd)/xmake-cache/cache"
          xmake g --pkg_installdir="$(pwd)/xmake-cache/packages"
          xmake repo -u

      # aqt 和 AstPy 都要 Python，而 manylinux 的 /opt/python/*/bin 不在默认 PATH 上。
      # 必须两条腿都加：x86_64 上不给 aqt 会装不了 Qt；aarch64 上（没有 Qt 步骤）
      # 不给的话 xmake 会退回到没有头文件的系统 python，编译 AstPy 时报
      # "fatal error: Python.h: No such file or directory"。
      - name: 准备 Python
        run: |
          set -euo pipefail
          pybin="$(ls -d /opt/python/cp3*/bin 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$pybin" ]; then
            echo "::error::容器里找不到 /opt/python/cp3*/bin"
            exit 1
          fi
          echo "$pybin" >> "$GITHUB_PATH"
          "$pybin/python3" --version

      # Qt 5.15.2 没有 linux_arm64 官方构建（aqt 报 "Failed to locate XML data for Qt
      # version '5.15.2'"），arm64 只能跳过；缺 Qt 时相关 target 会在 target 体内
      # set_enabled(false) 自行禁用，不会半途变成 phony 混进包里。
      - name: 配置Qt环境
        if: matrix.arch == 'x86_64'
        run: |
          set -euo pipefail
          xrepo install -y aqt
          xrepo info aqt
          xmake require -y qt

      - name: 临时测试为什么cspice包编译失败
        run: |
          set -euo pipefail
          xmake b -P thirdparty/cspice-linux || true

      # linux 下只用编译 release 版本
      - name: 配置release版本
        run: |
          set -euo pipefail
          xmake f -cy --with_test=y -m release -a ${{ matrix.arch }}

      - name: 编译release版本
        run: |
          set -euo pipefail
          xmake -ay

      - name: 打包二进制包
        run: |
          set -euo pipefail
          xmake f -cy --with_test=y -m release -a ${{ matrix.arch }}
          xmake pack -y -f zip -o artifacts/ --basename=SpaceAST

      # 卡住 ABI 下限，这两个数是"能在哪些发行版上跑"的完整答案，也是本分支存在的理由：
      #   GLIBC 2.23   —— 银河麒麟 V4（基于 Ubuntu 16.04）。这条能成立，靠的是源码里
      #                   不再有 powf/pow 这类被 glibc 重新版本化过的 libm 调用、
      #                   AstPy 不再链静态 CPython（见 xmake.lua 的 python headeronly）。
      #   GLIBCXX 3.4.21 —— std::__cxx11::basic_string 的 C++11 ABI 地板，降不下去；
      #                   只要不碰 std::thread（GCC 6 起挂在 3.4.22）就正好停在这里。
      # 超了就是有新的代码/依赖把基线抬回去了，要顺着报出来的文件和符号去查，而不是把
      # 门槛上调了事。若确实必须上调，务必同步改 docs/guide/quickstart.md 的系统要求。
      - name: ABI 门槛校验
        run: |
          set -euo pipefail
          bash scripts/ci/check-abi.sh artifacts/SpaceAST.zip \
            --max-glibc=2.23 --max-glibcxx=3.4.21 --glibcxx=fail

      - name: 测试 xmake.sh 编译
        run: |
          set -euo pipefail
          ./scripts/xpack/runself.sh --builddir=build-xsh
          rm -rf build-xsh

      - name: 打包自安装源码包
        run: |
          set -euo pipefail
          xmake f -cy --with_test=y -m release -a ${{ matrix.arch }}
          xmake pack -y -f runself -o artifacts/ --basename=SpaceAST

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SpaceAST-linux-${{ matrix.arch }}
          path: artifacts/

      - name: 发布产物-二进制包
        if: github.event.action == 'published'
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: artifacts/SpaceAST.zip
          asset_name: SpaceAST-${{ github.event.release.tag_name }}-linux-${{ matrix.arch }}.zip
          asset_content_type: application/zip

      - name: 发布产物-自安装源码包
        if: github.event.action == 'published' && matrix.arch == 'x86_64'
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: artifacts/SpaceAST.gz.run
          asset_name: SpaceAST-${{ github.event.release.tag_name }}-linux-any.gz.run
          asset_content_type: application/x-makeself

      - name: 更新预发布-二进制包
        if: needs.nightly-guard.outputs.ok == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/SpaceAST.zip
          asset_name: SpaceAST-nightly-linux-${{ matrix.arch }}.zip
          tag: nightly
          overwrite: true
          prerelease: true
          release_name: Nightly Build-预发布版

      - name: 更新预发布-自安装源码包
        if: needs.nightly-guard.outputs.ok == 'true' && matrix.arch == 'x86_64'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/SpaceAST.gz.run
          asset_name: SpaceAST-nightly-linux-any.gz.run
          tag: nightly
          overwrite: true
          prerelease: true
          release_name: Nightly Build-预发布版
