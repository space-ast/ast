name: 编译

on:
  pull_request:
  push:
    branches:
      - '**'  # 仅分支推送触发，忽略 tag 推送（tag 和 release:published 会出现并发组冲突）
  release:
    types: [published]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-2022, ubuntu-24.04]  # ubuntu-22.04
        arch: [x64, arm64]

    runs-on: ${{ matrix.os }}
    concurrency:
        group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-${{ matrix.os }}-${{ matrix.arch }}-build
        cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history for git tag operations
          fetch-depth: 0
          submodules: true
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          # this is not supported, use dev branch instead
          # xmake-version: local#
          xmake-version: branch@dev

      # Cache xmake dependencies
      - name: 配置依赖缓存
        uses: actions/cache@v4
        with:
          path: xmake-cache
          key: build-${{ matrix.os }}-${{ matrix.arch }}-xmake-cache-v1

      # Cache build directory
      - name: 配置编译缓存
        if: github.event.action != 'published' && github.ref != 'refs/heads/master'
        uses: actions/cache@v4
        with:
          path: |
            build
            .xmake
          key: build-${{ runner.os }}-${{ matrix.arch }}-build-${{ github.sha }}
          restore-keys: |
            build-${{ runner.os }}-${{ matrix.arch }}-build-

      - name: 设置xmake相关目录
        run: |
          xmake g --pkg_cachedir=$(pwd)/xmake-cache/cache
          xmake g --pkg_installdir=$(pwd)/xmake-cache/packages
          xmake repo -u
      
      - name: 配置opengl环境
        if: runner.os != 'Windows'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: libgl1-mesa-dev libglu1-mesa-dev
          version: 2
          
      - name: 配置debug版本
        run: |
          xmake f -cvy --with_test=y --qt_sdkver=5.15.2 -m debug 
          
      - name: 编译debug版本
        run: |
          xmake

      - name: 配置release版本
        run: |
          xmake f -cvy --with_test=y --qt_sdkver=5.15.2 -m release

      - name: 编译release版本
        run: |
          xmake

      - name: 打包项目
        run: |
          xmake f -cy --with_test=y -m release
          xmake pack -f zip -o artifacts/ --basename=SpaceAST
      
      - name: 获取发布信息
        id: release-info
        shell: bash
        run: |
          # Map runner OS to friendly name
          case "${{ matrix.os }}" in
            windows-*) echo "plat=windows" >> $GITHUB_OUTPUT ;;
            ubuntu-*)  echo "plat=linux" >> $GITHUB_OUTPUT ;;
            *)         echo "plat=${{ matrix.os }}" >> $GITHUB_OUTPUT ;;
          esac
          # Map arch to friendly name (x86_64 for Linux x64)
          case "${{ matrix.os }}" in
            ubuntu-*)
              case "${{ matrix.arch }}" in
                x64)   echo "arch=x86_64" >> $GITHUB_OUTPUT ;;
                arm64) echo "arch=arm64" >> $GITHUB_OUTPUT ;;
                *)     echo "arch=${{ matrix.arch }}" >> $GITHUB_OUTPUT ;;
              esac ;;
            *)
              echo "arch=${{ matrix.arch }}" >> $GITHUB_OUTPUT ;;
          esac

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SpaceAST-${{ steps.release-info.outputs.plat }}-${{ steps.release-info.outputs.arch }}
          path: artifacts/SpaceAST.zip
           
      - name: 发布产物
        if: github.event.action == 'published'
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: artifacts/SpaceAST.zip
          asset_name: SpaceAST-${{ github.event.release.tag_name }}-${{ steps.release-info.outputs.plat }}-${{ steps.release-info.outputs.arch }}.zip
          asset_content_type: application/zip
      
      - name: 更新 nightly tag
        if: github.ref == 'refs/heads/master' && matrix.os == 'windows-2022' && matrix.arch == 'x64'
        shell: bash
        run: |
          git tag -f nightly "${{ github.sha }}"
          git push -f origin nightly

      - name: 更新 nightly prerelease
        if: github.ref == 'refs/heads/master'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/SpaceAST.zip
          asset_name: SpaceAST-nightly-${{ steps.release-info.outputs.plat }}-${{ steps.release-info.outputs.arch }}.zip
          tag: nightly
          overwrite: true
          prerelease: true
          release_name: Nightly Build