name: 编译

on:
  pull_request:
  push:
    branches:
      - '**'  # 仅分支推送触发，忽略 tag 推送（tag 和 release:published 会出现并发组冲突）
  release:
    types: [published]

permissions:
  # 推 nightly tag、上传 release 资产需要；显式声明，不依赖仓库默认权限设置
  contents: write

jobs:
  # Windows 不支持 job 级 container，因此与 Linux 拆成两个 job，共用 .github/actions/ast-build
  build-windows:
    strategy:
      matrix:
        arch: [x64, arm64]
    runs-on: windows-2022
    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-windows-${{ matrix.arch }}-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history for git tag operations
          fetch-depth: 0
          submodules: true

      - uses: ./.github/actions/ast-build
        with:
          plat: windows
          arch: ${{ matrix.arch }}
          token: ${{ secrets.GITHUB_TOKEN }}

  # Linux 在 manylinux_2_28 容器里构建：AlmaLinux 8 + glibc 2.28 + gcc-toolset。
  # glibc 2.28 是 job 级 container 能跑 Node 24 的底线，再老（manylinux2014 = glibc 2.17）
  # 会让 checkout / cache / upload-artifact 直接 GLIBC_2.28 not found。
  # 具体 gcc-toolset 版本随官方镜像构建浮动（引入时是 11，当前默认 14），
  # 镜像内 `ls /opt/rh` 可确认；编出的产物对应的 libstdc++ 版本也跟着变。
  build-linux:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            image: manylinux_2_28_x86_64
            arch: x86_64
          - runner: ubuntu-24.04-arm
            image: manylinux_2_28_aarch64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/pypa/${{ matrix.image }}
    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-linux-${{ matrix.arch }}-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history for git tag operations
          fetch-depth: 0
          submodules: true

      - uses: ./.github/actions/ast-build
        with:
          plat: linux
          arch: ${{ matrix.arch }}
          token: ${{ secrets.GITHUB_TOKEN }}
