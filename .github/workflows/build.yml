name: 编译

on:
  pull_request:
  push:
    branches:
      - '**'  # 仅分支推送触发，忽略 tag 推送（tag 和 release:published 会出现并发组冲突）
  release:
    types: [published]
  workflow_dispatch:  # 手动触发，便于不推 master 也能验证构建与打包

permissions:
  # 推 nightly tag、上传 release 产物需要；显式声明，不依赖仓库默认权限设置
  contents: write

jobs:
  # 判断是否需要更新 nightly 版本
  nightly-guard:
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.guard.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          # ls-remote 不读本地历史，tag 也只打在 github.sha（即 HEAD）上，
          # 全量历史有 250+ MB 而 HEAD 快照只有 12 MB，这里没必要拉历史。
          fetch-depth: 1

      - name: 检查 nightly 可否更新
        id: guard
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "非 master 分支($GITHUB_REF)，不更新 nightly"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA="${{ github.sha }}"
          # 只允许"仍然是 master 顶端"的提交更新 nightly。
          # 重跑旧的 run 时 github.sha 仍是那次 push 的旧提交，直接推会把 nightly 标签重置为旧提交。
          # 用 ls-remote 比对远端顶端，不依赖本地历史。
          TIP="$(git ls-remote origin refs/heads/master 2>/dev/null || true)"
          TIP="${TIP%%[[:space:]]*}"
          echo "TIP=$TIP"
          echo "SHA=$SHA"
          if [ -z "$TIP" ]; then
            echo "::warning::取不到远端 master 顶端(ls-remote 失败)，跳过 nightly 更新"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ "$TIP" = "$SHA" ]; then
            echo "master 顶端即本次提交，允许更新 nightly"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::本次提交 $SHA 不是 master 当前顶端 $TIP(疑似重跑旧 run, 或构建期间已有新推送)，跳过 nightly 更新，避免回退"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 更新 nightly tag
        if: steps.guard.outputs.ok == 'true'
        shell: bash
        run: |
          git tag -f nightly "${{ github.sha }}"
          git push -f origin nightly

  build-windows:
    needs: nightly-guard
    # guard 自身失败不该挡住构建（nightly 与否由它的 outputs 决定）；但被取消时不必再跑
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        # arm64 必须跑在 windows-11-arm 上
        # 交叉编译出来的 arm64 在 x64 上执行不了，测试无法进行
        target:
          - { runner: windows-2022,   arch: x64   }
          - { runner: windows-2022,   arch: x86   }
          - { runner: windows-11-arm, arch: arm64 }
    runs-on: ${{ matrix.target.runner }}
    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-windows-${{ matrix.target.arch }}-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # 本 job 不跑任何 git 命令（发布全走 API action），版本号取自 xmake.lua 的字面量，
          # 保持默认浅克隆即可；子模块也会跟着用 --depth=1。
          submodules: true
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          # this is not supported, use dev branch instead
          # xmake-version: local#
          xmake-version: branch@dev
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: ${{ matrix.target.runner }}

      # Cache xmake dependencies
      - name: 配置依赖缓存
        uses: actions/cache@v4
        with:
          path: xmake-cache
          key: build-${{ matrix.target.runner }}-${{ matrix.target.arch }}-xmake-cache-v2-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}

      # Cache build directory
      - name: 配置编译缓存
        if: github.event.action != 'published' && github.ref != 'refs/heads/master'
        uses: actions/cache@v4
        with:
          path: |
            build
            .xmake
          key: build-${{ matrix.target.runner }}-${{ matrix.target.arch }}-build-v2-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-${{ github.sha }}
          restore-keys: |
            build-${{ matrix.target.runner }}-${{ matrix.target.arch }}-build-v2-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-

      - name: 设置xmake相关目录
        run: |
          xmake g --pkg_cachedir=$(pwd)/xmake-cache/cache
          xmake g --pkg_installdir=$(pwd)/xmake-cache/packages
          xmake repo -u

      # arm64 上拿不到 Qt
      - name: 配置Qt环境
        if: matrix.target.arch != 'arm64'
        run: |
          xrepo install -y aqt
          xrepo info aqt
          xmake require -y qt

      - name: 配置debug版本
        run: |
          xmake f -cy --with_test=y -m debug -a ${{ matrix.target.arch }}

      - name: 编译debug版本
        run: |
          xmake -ay

      - name: 配置release版本
        run: |
          xmake f -cy --with_test=y -m release -a ${{ matrix.target.arch }}

      - name: 编译release版本
        run: |
          xmake -ay

      - name: 打包二进制包
        run: |
          xmake f -cy --with_test=y -m release -a ${{ matrix.target.arch }}
          xmake pack -y -f zip -o artifacts/ --basename=SpaceAST

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SpaceAST-windows-${{ matrix.target.arch }}
          path: artifacts/

      # ── 正式发布：GitHub / Gitee / GitCode ────────────────────────────
      # 三个平台的发布 action 都按文件名（basename）上传、不支持上传时改名，
      # 所以先在本地复制出带版本号的副本，三边共用同一份 files glob。
      # Gitee/GitCode 那两步额外加 preserve_order（实现串行上传）：跨境实测有时只有 20–90 KB/s，
      # 同一个 job 里两路并发会把链路对半分，两个文件都拖得更久、也都更容易被掐断。
      - name: 准备发布产物-二进制包
        if: github.event.action == 'published'
        shell: bash
        run: |
          mkdir -p release-assets
          cp artifacts/SpaceAST.zip \
            "release-assets/SpaceAST-${{ github.event.release.tag_name }}-windows-${{ matrix.target.arch }}.zip"

      # 只传 tag_name/files：release 已由 tag-release.yml 建好，action 对已存在的
      # release 走增量更新，正文、名称、预发布标记都保持原样，不会被这里改掉。
      - name: 发布产物-二进制包到 GitHub
        if: github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*.zip
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 同步发布-二进制包到 Gitee
        if: github.event.action == 'published'
        continue-on-error: true  # 失败也不影响后续步骤
        uses: space-ast/action-git-release@v1
        timeout-minutes: 355
        with:
          platform: gitee
          repository: space-ast/ast
          token: ${{ secrets.GITEE_TOKEN }}
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.name }}
          body: ${{ github.event.release.body }}
          files: release-assets/*.zip
          fail_on_unmatched_files: 'true'
          preserve_order: 'true'

      - name: 同步发布-二进制包到 GitCode
        if: github.event.action == 'published'
        continue-on-error: true  # 失败也不影响后续步骤
        uses: space-ast/action-git-release@v1
        timeout-minutes: 355
        with:
          platform: gitcode
          repository: space-ast/ast
          token: ${{ secrets.GITCODE_TOKEN }}
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.name }}
          body: ${{ github.event.release.body }}
          files: release-assets/*.zip
          fail_on_unmatched_files: 'true'
          preserve_order: 'true'

      # ── nightly 预发布：GitHub / Gitee / GitCode ──────────────────────
      # nightly 用固定的 nightly 标签反复覆盖，所以每次都按文件名覆盖同名附件
      - name: 准备 nightly 产物
        if: needs.nightly-guard.outputs.ok == 'true'
        shell: bash
        run: |
          mkdir -p nightly-assets
          cp artifacts/SpaceAST.zip \
            "nightly-assets/SpaceAST-nightly-windows-${{ matrix.target.arch }}.zip"

      # 发布说明里的时间戳用北京时间。runner 是 UTC，用 date -u -d 直接做偏移，
      # 不依赖 tzdata（Windows runner 的 Git Bash 没有 zoneinfo），容器里的 coreutils 行为一致。
      - name: 生成 nightly 发布说明
        id: nightly_note
        if: needs.nightly-guard.outputs.ok == 'true'
        shell: bash
        run: |
          {
            echo 'body<<EOF_BODY'
            echo '流水线自动构建的每夜版, 随主分支更新'
            echo
            echo "最近更新：$(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')(UTC+8)"
            echo 'EOF_BODY'
          } >> "$GITHUB_OUTPUT"

      # prerelease 必须显式传：GitHub 创建 release 接口的 make_latest 默认是 true，
      # 漏传会让首次创建出来的 nightly release 被当成正式版。
      - name: 更新 nightly 产物到 GitHub
        if: needs.nightly-guard.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build-预发布版
          prerelease: true
          files: nightly-assets/*.zip
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新 nightly 到 Gitee
        if: needs.nightly-guard.outputs.ok == 'true'
        continue-on-error: true  # 失败也不影响后续步骤
        uses: space-ast/action-git-release@v1
        timeout-minutes: 355
        with:
          platform: gitee
          repository: space-ast/ast
          token: ${{ secrets.GITEE_TOKEN }}
          tag_name: nightly
          name: Nightly Build-预发布版
          body: ${{ steps.nightly_note.outputs.body }}
          prerelease: 'true'
          files: nightly-assets/*.zip
          overwrite_files: 'true'
          fail_on_unmatched_files: 'true'
          preserve_order: 'true'

      - name: 更新 nightly 到 GitCode
        if: needs.nightly-guard.outputs.ok == 'true'
        continue-on-error: true  # 失败也不影响后续步骤
        uses: space-ast/action-git-release@v1
        timeout-minutes: 355
        with:
          platform: gitcode
          repository: space-ast/ast
          token: ${{ secrets.GITCODE_TOKEN }}
          tag_name: nightly
          name: Nightly Build-预发布版
          body: ${{ steps.nightly_note.outputs.body }}
          prerelease: 'true'
          files: nightly-assets/*.zip
          overwrite_files: 'true'
          fail_on_unmatched_files: 'true'
          preserve_order: 'true'

      - name: 恢复归档测试用例
        shell: bash
        run: cp -r test/Archive/* test

      - name: 测试
        timeout-minutes: 90
        run: |
          xmake cpdata
          xmake test --output-on-failure

  # Linux 在 manylinux_2_28 容器里构建：AlmaLinux 8 + glibc 2.28
  build-linux:
    needs: nightly-guard
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            image: manylinux_2_28_x86_64
            arch: x86_64
          - runner: ubuntu-22.04-arm
            image: manylinux_2_28_aarch64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/pypa/${{ matrix.image }}
    defaults:
      run:
        shell: bash
    env:
      # 容器里以 root 运行，xmake 默认拒绝工作，需要设置 XMAKE_ROOT=y 才能正常工作
      # （error: Running xmake as root is extremely dangerous and no longer supported.）
      XMAKE_ROOT: y
    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-linux-${{ matrix.arch }}-build
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # 同 build-windows：本 job 不跑任何 git 命令，保持默认浅克隆
          submodules: true

      # 容器镜像很干净：Qt 链接期的 X11/字体/GL 依赖，以及打包要用的 zip，都得自己装
      - name: 配置系统依赖
        run: |
          echo "=== 编译器 ==="
          which -a gcc g++ ld ar ranlib 2>/dev/null || true
          gcc --version | head -n 1
          echo "=== CPU 基线 ==="
          echo | gcc -S -x c -o /dev/null -v - 2>&1 | grep -o 'march=[^ ]*' || true
          echo "=== 关键环境变量 ==="
          env | grep -E '^(PATH|LD_LIBRARY_PATH|LIBRARY_PATH|CPATH)=' || true
          echo "=== 工具链自带的 libstdc++ 版本上限 ==="
          readelf --version-info /usr/lib64/libstdc++.so.6 2>/dev/null \
            | grep -oE 'GLIBCXX_[0-9.]+' | sort -V | tail -n 1 || true

          dnf install -y --setopt=install_weak_deps=False \
            zip unzip xz tar which git curl wget \
            binutils make pkgconf-pkg-config \
            mesa-libGL-devel mesa-libGLU-devel \
            libX11-devel libXext-devel libXrender-devel libXrandr-devel libXfixes-devel \
            libXi-devel libXcursor-devel libXinerama-devel libXScrnSaver-devel \
            libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel \
            fontconfig-devel freetype-devel libpng-devel \
            glib2-devel dbus-devel alsa-lib-devel libSM-devel libICE-devel \
            openssl-devel

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: ${{ matrix.image }}

      # 缓存键里加上的第三方库的内容哈希，使第三方库的内容改变时触发重新编译
      - name: 配置依赖缓存
        uses: actions/cache@v4
        with:
          path: xmake-cache
          key: xmake-deps-${{ matrix.image }}-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-v1

      # 缓存键里加上的第三方库的内容哈希，使第三方库的内容改变时触发重新编译
      - name: 配置编译缓存
        if: github.event.action != 'published' && github.ref != 'refs/heads/master'
        uses: actions/cache@v4
        with:
          path: |
            build
            .xmake
          key: xmake-build-${{ matrix.image }}-v1-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-${{ github.sha }}
          restore-keys: |
            xmake-build-${{ matrix.image }}-v1-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-

      - name: 设置xmake相关目录
        run: |
          xmake g --pkg_cachedir="$(pwd)/xmake-cache/cache"
          xmake g --pkg_installdir="$(pwd)/xmake-cache/packages"
          xmake repo -u

      # aqt 和 AstPy 都要 Python，而 manylinux 的 /opt/python/*/bin 不在默认 PATH 上。
      # 避免退回到没有头文件的系统 python，导致编译 AstPy 时报错
      - name: 准备 Python
        run: |
          pybin="$(ls -d /opt/python/cp3*/bin 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$pybin" ]; then
            echo "::error::容器里找不到 /opt/python/cp3*/bin"
            exit 1
          fi
          echo "$pybin" >> "$GITHUB_PATH"
          "$pybin/python3" --version

      # Qt 5.15.2 没有 linux_arm64 官方构建，arm64 只能跳过
      - name: 配置Qt环境
        if: matrix.arch == 'x86_64'
        run: |
          xrepo install -y aqt
          xrepo info aqt
          xmake require -y qt


      # linux 下只用编译 release 版本
      - name: 配置release版本
        run: |
          xmake f -cy --with_test=y -m release -a ${{ matrix.arch }}

      - name: 编译release版本
        run: |
          xmake -ay

      - name: 打包二进制包
        run: |
          xmake f -cy --with_test=y -m release -a ${{ matrix.arch }}
          xmake pack -y -f zip -o artifacts/ --basename=SpaceAST

      # 检查动态库的 ABI 版本是否符合要求，使得能在大部分linux发行版上运行
      - name: ABI 门槛校验
        run: |
          bash scripts/ci/check-abi.sh artifacts/SpaceAST.zip \
            --max-glibc=2.23 --max-glibcxx=3.4.21 --glibcxx=fail

      - name: 测试 xmake.sh 编译
        run: |
          ./scripts/xpack/runself.sh --builddir=build-xsh
          rm -rf build-xsh

      - name: 打包自安装源码包
        run: |
          xmake f -cy --with_test=y -m release -a ${{ matrix.arch }}
          xmake pack -y -f runself -o artifacts/ --basename=SpaceAST

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SpaceAST-linux-${{ matrix.arch }}
          path: artifacts/

      # ── 正式发布：GitHub / Gitee / GitCode ────────────────────────────
      # 三个平台的发布 action 都按文件名（basename）上传、不支持上传时改名，
      # 所以先在本地复制出带版本号的副本，三边共用同一份 files glob。
      # Gitee/GitCode 那两步额外加 preserve_order（实现串行上传）：跨境实测有时只有 20–90 KB/s，
      # 同一个 job 里两路并发会把链路对半分，两个文件都拖得更久、也都更容易被掐断。
      - name: 准备发布产物-linux
        if: github.event.action == 'published'
        shell: bash
        run: |
          mkdir -p release-assets
          cp artifacts/SpaceAST.zip \
            "release-assets/SpaceAST-${{ github.event.release.tag_name }}-linux-${{ matrix.arch }}.zip"
          # runself 是纯源码包、不含架构, basename 里也是 linux-any, 两个架构都会产出这个同名文件；
          # 只让 x86_64 发布，免得两个 job 去抢同一个附件名。
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cp artifacts/SpaceAST.gz.run \
              "release-assets/SpaceAST-${{ github.event.release.tag_name }}-linux-any.gz.run"
          fi

      # 只传 tag_name/files：release 已由 tag-release.yml 建好，action 对已存在的
      # release 走增量更新，正文、名称、预发布标记都保持原样，不会被这里改掉。
      - name: 发布产物-linux 到 GitHub
        if: github.event.action == 'published'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 同步发布-linux 产物到 Gitee
        if: github.event.action == 'published'
        continue-on-error: true  # 失败也不影响后续步骤
        uses: space-ast/action-git-release@v1
        timeout-minutes: 355
        with:
          platform: gitee
          repository: space-ast/ast
          token: ${{ secrets.GITEE_TOKEN }}
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.name }}
          body: ${{ github.event.release.body }}
          files: release-assets/*
          fail_on_unmatched_files: 'true'
          preserve_order: 'true'

      - name: 同步发布-linux 产物到 GitCode
        if: github.event.action == 'published'
        continue-on-error: true  # 失败也不影响后续步骤
        uses: space-ast/action-git-release@v1
        timeout-minutes: 355
        with:
          platform: gitcode
          repository: space-ast/ast
          token: ${{ secrets.GITCODE_TOKEN }}
          tag_name: ${{ github.event.release.tag_name }}
          name: ${{ github.event.release.name }}
          body: ${{ github.event.release.body }}
          files: release-assets/*
          fail_on_unmatched_files: 'true'
          preserve_order: 'true'

      # ── nightly 预发布：GitHub / Gitee / GitCode ──────────────────────
      - name: 准备 nightly 产物-linux
        if: needs.nightly-guard.outputs.ok == 'true'
        shell: bash
        run: |
          mkdir -p nightly-assets
          cp artifacts/SpaceAST.zip \
            "nightly-assets/SpaceAST-nightly-linux-${{ matrix.arch }}.zip"
          # 同正式发布: linux-any 的源码包只由 x86_64 发
          if [ "${{ matrix.arch }}" = "x86_64" ]; then
            cp artifacts/SpaceAST.gz.run "nightly-assets/SpaceAST-nightly-linux-any.gz.run"
          fi

      # 发布说明里的时间戳用北京时间。runner 是 UTC，用 date -u -d 直接做偏移，
      # 不依赖 tzdata（Windows runner 的 Git Bash 没有 zoneinfo），容器里的 coreutils 行为一致。
      - name: 生成 nightly 发布说明
        id: nightly_note
        if: needs.nightly-guard.outputs.ok == 'true'
        shell: bash
        run: |
          {
            echo 'body<<EOF_BODY'
            echo '流水线自动构建的每夜版, 随主分支更新'
            echo
            echo "最近更新：$(date -u -d '+8 hours' '+%Y-%m-%d %H:%M')(UTC+8)"
            echo 'EOF_BODY'
          } >> "$GITHUB_OUTPUT"

      # prerelease 必须显式传：GitHub 创建 release 接口的 make_latest 默认是 true，
      # 漏传会让首次创建出来的 nightly release 被当成正式版。
      - name: 更新 nightly 产物到 GitHub
        if: needs.nightly-guard.outputs.ok == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build-预发布版
          prerelease: true
          files: nightly-assets/*
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 更新 nightly 到 Gitee
        if: needs.nightly-guard.outputs.ok == 'true'
        continue-on-error: true  # 失败也不影响后续步骤
        uses: space-ast/action-git-release@v1
        timeout-minutes: 355
        with:
          platform: gitee
          repository: space-ast/ast
          token: ${{ secrets.GITEE_TOKEN }}
          tag_name: nightly
          name: Nightly Build-预发布版
          body: ${{ steps.nightly_note.outputs.body }}
          prerelease: 'true'
          files: nightly-assets/*
          overwrite_files: 'true'
          fail_on_unmatched_files: 'true'
          preserve_order: 'true'

      - name: 更新 nightly 到 GitCode
        if: needs.nightly-guard.outputs.ok == 'true'
        continue-on-error: true  # 失败也不影响后续步骤
        uses: space-ast/action-git-release@v1
        timeout-minutes: 355
        with:
          platform: gitcode
          repository: space-ast/ast
          token: ${{ secrets.GITCODE_TOKEN }}
          tag_name: nightly
          name: Nightly Build-预发布版
          body: ${{ steps.nightly_note.outputs.body }}
          prerelease: 'true'
          files: nightly-assets/*
          overwrite_files: 'true'
          fail_on_unmatched_files: 'true'
          preserve_order: 'true'

      - name: 测试
        timeout-minutes: 90
        run: |
          cp -r test/Archive/* test
          xmake cpdata
          xmake test --output-on-failure
