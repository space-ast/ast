name: 编译

on:
  pull_request:
  push:
    branches:
      - '**'  # 仅分支推送触发，忽略 tag 推送（tag 和 release:published 会出现并发组冲突）
  release:
    types: [published]

permissions:
  # 推 nightly tag、上传 release 资产需要；显式声明，不依赖仓库默认权限设置
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            plat: windows
            arch: x64
          - os: windows-2022
            plat: windows
            arch: arm64
          - os: windows-2022
            plat: windows
            arch: x86
          - os: ubuntu-22.04
            plat: linux
            arch: x86_64
          - os: ubuntu-22.04-arm
            plat: linux
            arch: arm64

    runs-on: ${{ matrix.os }}
    concurrency:
        group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-${{ matrix.os }}-${{ matrix.arch }}-build
        cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # Need full history for git tag operations
          fetch-depth: 0
          submodules: true
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          # this is not supported, use dev branch instead
          # xmake-version: local#
          xmake-version: branch@dev

      # Cache xmake dependencies
      - name: 配置依赖缓存
        uses: actions/cache@v4
        with:
          path: xmake-cache
          key: build-${{ matrix.os }}-${{ matrix.arch }}-xmake-cache-v2

      # Cache build directory
      - name: 配置编译缓存
        if: github.event.action != 'published' && github.ref != 'refs/heads/master'
        uses: actions/cache@v4
        with:
          path: |
            build
            .xmake
          key: build-${{ matrix.os }}-${{ matrix.arch }}-build-v2-${{ github.sha }}
          restore-keys: |
            build-${{ matrix.os }}-${{ matrix.arch }}-build-v2-

      - name: 设置xmake相关目录
        run: |
          xmake g --pkg_cachedir=$(pwd)/xmake-cache/cache
          xmake g --pkg_installdir=$(pwd)/xmake-cache/packages
          xmake repo -u
      
      - name: 配置opengl环境
        if: runner.os != 'Windows'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: libgl1-mesa-dev libglu1-mesa-dev
          version: 2

      # arm64 上拿不到 Qt
      - name: 配置Qt环境
        if: matrix.arch != 'arm64'
        run: |
          xrepo install -y aqt
          xrepo info aqt
          xmake require -y qt

      - name: 配置debug版本
        run: |
          xmake f -cy --with_test=y -m debug -a ${{ matrix.arch }}

      - name: 编译debug版本
        run: |
          xmake -ay

      - name: 配置release版本
        run: |
          xmake f -cy --with_test=y -m release -a ${{ matrix.arch }}

      - name: 编译release版本
        run: |
          xmake -ay

      - name: 打包二进制包
        run: |
          xmake f -cy --with_test=y -m release -a ${{ matrix.arch }}
          xmake pack -y -f zip -o artifacts/ --basename=SpaceAST

      - name: 测试 xmake.sh 编译
        if: runner.os != 'Windows'
        run: |
          ./scripts/xpack/runself.sh --builddir=build-xsh

      - name: 打包自安装源码包
        if: runner.os != 'Windows'
        run: |
          xmake f -cy --with_test=y -m release -a ${{ matrix.arch }}
          xmake pack -y -f runself -o artifacts/ --basename=SpaceAST
      
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: SpaceAST-${{ matrix.plat }}-${{ matrix.arch }}
          path: artifacts/
           
      - name: 发布产物-二进制包
        if: github.event.action == 'published'
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: artifacts/SpaceAST.zip
          asset_name: SpaceAST-${{ github.event.release.tag_name }}-${{ matrix.plat }}-${{ matrix.arch }}.zip
          asset_content_type: application/zip
      
      - name: 发布产物-自安装源码包
        if: github.event.action == 'published' && runner.os != 'Windows' && matrix.arch == 'x64'
        uses: actions/upload-release-asset@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: artifacts/SpaceAST.gz.run
          asset_name: SpaceAST-${{ github.event.release.tag_name }}-linux-any.gz.run
          asset_content_type: application/x-makeself

      - name: 检查 nightly 可否更新
        id: nightly-guard
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/master" ]; then
            echo "非 master 分支($GITHUB_REF)，不更新 nightly"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA="${{ github.sha }}"
          # 只允许"仍然是 master 顶端"的提交更新 nightly。
          # 重跑旧的 run 时 github.sha 仍是那次 push 的旧提交，直接推会把 nightly 打回去。
          # 用 ls-remote 比对远端顶端，不依赖本地历史。
          TIP="$(git ls-remote origin refs/heads/master 2>/dev/null || true)"
          TIP="${TIP%%[[:space:]]*}"
          echo "TIP=$TIP"
          echo "SHA=$SHA"
          if [ -z "$TIP" ]; then
            echo "::warning::取不到远端 master 顶端(ls-remote 失败)，跳过 nightly 更新"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          elif [ "$TIP" = "$SHA" ]; then
            echo "master 顶端即本次提交，允许更新 nightly"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::本次提交 $SHA 不是 master 当前顶端 $TIP(疑似重跑旧 run, 或构建期间已有新推送)，跳过 nightly 更新，避免回退"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 更新 nightly tag
        if: steps.nightly-guard.outputs.ok == 'true' && runner.os != 'Windows' && matrix.arch == 'x64'
        shell: bash
        run: |
          git tag -f nightly "${{ github.sha }}"
          git push -f origin nightly

      - name: 更新预发布-二进制包
        if: steps.nightly-guard.outputs.ok == 'true'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/SpaceAST.zip
          asset_name: SpaceAST-nightly-${{ matrix.plat }}-${{ matrix.arch }}.zip
          tag: nightly
          overwrite: true
          prerelease: true
          release_name: Nightly Build-预发布版

      - name: 更新预发布-自安装源码包
        if: steps.nightly-guard.outputs.ok == 'true' && runner.os != 'Windows' && matrix.arch == 'x64'
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: artifacts/SpaceAST.gz.run
          asset_name: SpaceAST-nightly-linux-any.gz.run
          tag: nightly
          overwrite: true
          prerelease: true
          release_name: Nightly Build-预发布版