name: openvbs 安装诊断

# 临时诊断用：忠实复现正式 workflow 的 Windows 配置步骤，并带 -v 让嵌套构建的
# 输出可见（正式 CI 只打印 "install openvbs latest .. failed"）。拿到结论后删除。

on:
  workflow_dispatch:
  push:
    branches:
      - ci/openvbs-install-probe

jobs:
  probe-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: windows-2022

      - name: 设置xmake相关目录
        shell: bash
        run: |
          xmake g --pkg_cachedir=$(pwd)/xmake-cache/cache
          xmake g --pkg_installdir=$(pwd)/xmake-cache/packages
          xmake repo -u
          xmake show

      # 与正式 workflow 完全相同的配置命令，只用 timeout 兜底：openvbs 的失败
      # 发生在配置早期，15 分钟足够，后面的包不用等
      - name: 配置（与正式 workflow 相同，带 -v）
        shell: bash
        run: |
          set +e
          # 显式 -p windows：Git Bash 下 xmake 会把宿主平台识别成 msys，
          # 与正式 CI（PowerShell，windows + MSVC）不一致
          timeout 900 xmake f -cy -p windows --with_test=y --check_warnings=n -m release -a x64 -v > configure.log 2>&1
          echo "configure_exit=$?"
          grep -n -i "openvbs" configure.log | tail -40 || true
          exit 0

      - name: 收集日志
        if: always()
        shell: bash
        run: |
          mkdir -p probe-artifacts
          cp configure.log probe-artifacts/ 2>/dev/null || true
          cp -r build/.packages/o/openvbs/latest/cache/installdir.failed probe-artifacts/ 2>/dev/null || true
          find probe-artifacts -type f | head -50

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openvbs-probe-windows-faithful
          path: probe-artifacts
