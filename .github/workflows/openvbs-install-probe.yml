name: openvbs 安装诊断

# 临时验证用：用真实 CI 的编译器（GCC 13 / MSVC 14.44）冷安装 openvbs，
# 确认子模块 b3eee94 的兼容性修复有效。拿到结论后连同分支一起删除。

on:
  workflow_dispatch:
  push:
    branches:
      - ci/openvbs-install-probe

jobs:
  # Linux x86_64：ubuntu-latest 是 GCC 13，会触发 libstdc++ 的 rebind static_assert
  probe-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: ubuntu-latest

      - name: 设置xmake相关目录
        shell: bash
        run: |
          xmake g --pkg_cachedir=$(pwd)/xmake-cache/cache
          xmake g --pkg_installdir=$(pwd)/xmake-cache/packages
          xmake repo -u
          xmake show

      - name: 冷安装openvbs
        shell: bash
        run: |
          set +e
          xmake require -y --force openvbs > install.log 2>&1
          echo "install_exit=$?"
          grep -E "install openvbs|error:" install.log | tail -20 || true
          exit 0

      - name: 收集日志
        if: always()
        shell: bash
        run: |
          mkdir -p probe-artifacts
          cp install.log probe-artifacts/ 2>/dev/null || true
          cp -r build/.packages/o/openvbs/latest/cache/installdir.failed probe-artifacts/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openvbs-fix-linux
          path: probe-artifacts

  # Windows：与正式 workflow 相同的配置命令，--plat=windows 才会走 MSVC 14.44
  probe-windows:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: windows-2022

      - name: 设置xmake相关目录
        shell: bash
        run: |
          xmake g --pkg_cachedir=$(pwd)/xmake-cache/cache
          xmake g --pkg_installdir=$(pwd)/xmake-cache/packages
          xmake repo -u
          xmake show

      - name: 配置（与正式 workflow 相同，带 -v）
        shell: bash
        run: |
          set +e
          # 显式 -p windows：Git Bash 下 xmake 会把宿主平台识别成 msys，
          # 与正式 CI（PowerShell，windows + MSVC）不一致
          timeout 900 xmake f -cy -p windows --with_test=y --check_warnings=n -m release -a x64 -v > configure.log 2>&1
          echo "configure_exit=$?"
          grep -n -i "openvbs" configure.log | tail -40 || true
          exit 0

      - name: 收集日志
        if: always()
        shell: bash
        run: |
          mkdir -p probe-artifacts
          cp configure.log probe-artifacts/ 2>/dev/null || true
          cp -r build/.packages/o/openvbs/latest/cache/installdir.failed probe-artifacts/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: openvbs-fix-windows
          path: probe-artifacts
