name: 测试

on:
  push:
    branches:
      - 'ci/asan-solar'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        mode: [debug]
        target:
          - { runner: ubuntu-22.04-arm, arch: arm64  }
    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-${{ matrix.target.runner }}-${{ matrix.target.arch }}-${{ matrix.mode }}-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          # this is not supported, use dev branch instead
          # xmake-version: local#
          xmake-version: branch@dev

      - name: 配置依赖缓存
        uses: actions/cache@v4
        with:
          path: xmake-cache
          key: test-${{ matrix.target.runner }}-${{ matrix.target.arch }}-xmake-cache-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-v1

      - name: 配置编译缓存
        if: github.ref != 'refs/heads/master'
        uses: actions/cache@v4
        with:
          path: |
            build
            .xmake
          key: test-${{ matrix.target.runner }}-${{ matrix.target.arch }}-${{ matrix.mode }}-build-v1-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-${{ github.sha }}
          restore-keys: |
            test-${{ matrix.target.runner }}-${{ matrix.target.arch }}-${{ matrix.mode }}-build-v1-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-

      - name: 设置xmake相关目录
        run: |
          xmake g --pkg_cachedir=$(pwd)/xmake-cache/cache
          xmake g --pkg_installdir=$(pwd)/xmake-cache/packages
          xmake repo -u

      - name: 配置项目
        run: |
          xmake f -cy --with_test=y --check_warnings=n -m ${{ matrix.mode }} -a ${{ matrix.target.arch }} \
            --cxflags="-fsanitize=address -fno-omit-frame-pointer" \
            --ldflags="-fsanitize=address"
          xmake show

      - name: 准备 SWIG
        if: runner.os == 'Linux'
        run: |
          SWIG_BIN="$(find "$PWD/xmake-cache/packages/s/swig" -type f -name swig 2>/dev/null | head -1)"
          if [ -n "$SWIG_BIN" ]; then echo "$(dirname "$SWIG_BIN")" >> "$GITHUB_PATH"; fi
          echo "swig: ${SWIG_BIN:-未找到}"

      - name: 恢复归档测试用例
        shell: bash
        run: cp -r test/Archive/* test

      - name: 编译
        run: |
          xmake build testSolarSystem

      - name: 运行 testSolarSystem (ASan)
        timeout-minutes: 30
        run: |
          xmake cpdata
          ROOT="$PWD"
          BIN="$ROOT/build/linux/arm64/${{ matrix.mode }}/testSolarSystem"

          echo "=== 产物信息 ==="
          ls -la "$BIN"
          # 先确认 ASan 真的链进去了，否则跑出来的报告毫无意义
          readelf -d "$BIN" | grep -iE 'NEEDED.*(asan|ubsan)|RUNPATH|RPATH' || true
          # libcspice.so 是 xmake 包，装在 xmake-cache/packages 下，靠 rpath/LD_LIBRARY_PATH 找。
          # 直接 ./xxx 会 exit=127（cannot open shared object file），必须走 xmake r
          echo "=== xmake 给的库搜索路径 ==="
          LD_LIBRARY_PATH="" ldd "$BIN" 2>&1 | grep -iE 'asan|cspice|not found' || true

          # 测试按 CWD 找 data/；xmake r 的 rundir 就是产物目录，和 cpdata 的目标一致
          set +e
          ASAN_OPTIONS=detect_leaks=0:print_stacktrace=1:log_path="$ROOT/asan.log" \
            xmake r testSolarSystem > "$ROOT/run.stdout" 2>&1
          echo "exit=$?"
          set -e

          echo "=== stdout tail ==="
          tail -60 "$ROOT/run.stdout"
          echo "=== asan reports ==="
          for f in "$ROOT"/asan.log.*; do
            [ -e "$f" ] || continue
            echo "### $f"
            head -c 200000 "$f"
          done
