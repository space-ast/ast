name: 测试

permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:  # 手动触发，便于不推分支也能验证测试

jobs:
  test:
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        mode: [release, debug, asan]
        # arm64 必须跑在 ubuntu-22.04-arm/windows-11-arm 上
        # 交叉编译出来的 arm64 在 x86_64/x64 上执行不了，测试无法进行
        target:
          - { runner: ubuntu-latest,    arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: arm64  }
          - { runner: windows-2022,     arch: x64    }
          - { runner: windows-2022,     arch: x86    }
          - { runner: windows-11-arm,   arch: arm64  }
    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-${{ matrix.target.runner }}-${{ matrix.target.arch }}-${{ matrix.mode }}-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          # this is not supported, use dev branch instead
          # xmake-version: local#
          xmake-version: branch@dev
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: ${{ matrix.target.runner }}
          package-cache: true
          package-cache-key: ${{ matrix.target.runner }}
          build-cache: true
          build-cache-key: ${{ matrix.target.runner }}
  
      - name: 准备 SWIG
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-swig

      - name: 配置项目
        # 依赖包安装要从网络取源码并编译，卡住时必须尽快失败，别耗满 6 小时的默认超时
        timeout-minutes: 60
        run: |
          xmake f -cy --with_test=y --check_warnings=n -m ${{ matrix.mode }} -a ${{ matrix.target.arch }}
          xmake show

      - name: 恢复归档测试用例
        shell: bash
        run: cp -r test/archive/* test

      - name: 编译
        env:
          # 编译期间跑的都是构建工具（swig / moc / 编译器），不是被测代码。
          # 避免因为存在 ASan 版的工具，让 LeakSanitizer 的泄漏报告把它判成失败。
          # 测试步骤不带这个变量，泄漏检测照常生效。
          ASAN_OPTIONS: detect_leaks=0
        run: |
          xmake -ay

      - name: 执行${{ matrix.mode }}测试
        timeout-minutes: 90
        run: |
          xmake cpdata
          xmake test --output-on-failure

      # 用目录联接/符号链接把 data/test-data 挂到超过 MAX_PATH 的目录下
      # 并将相关路径作为环境变量写入 GITHUB_ENV，供后续 step 使用
      - name: 准备超长数据目录
        timeout-minutes: 15
        run: xmake run PrepareLongPathData

      # 环境变量通过 GITHUB_ENV 传给本 step
      # 先跑一次 --check，确认 aDataDir 等没有静默回退到默认目录
      - name: 执行超长数据目录测试
        timeout-minutes: 90
        run: |
          xmake run PrepareLongPathData --check
          xmake test --output-on-failure

  # release.yml 的 Linux 产物在 manylinux_2_28 容器里构建（glibc 2.28），
  # 上面的 ubuntu-latest / ubuntu-22.04-arm 用的是新 glibc，测不出老系统上的运行期问题
  # 因此在同样的容器里再构建一次 release 并跑测试。
  # 这里不装 Qt：test/gui 下的目标没有 add_tests，xmake test 不会执行它们，
  # Qt 只影响编译范围，不影响测试结果。
  test-manylinux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            image: manylinux_2_28_x86_64
            arch: x86_64
          - runner: ubuntu-22.04-arm
            image: manylinux_2_28_aarch64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    container:
      image: quay.io/pypa/${{ matrix.image }}
    defaults:
      run:
        shell: bash
    env:
      # 容器里以 root 运行，xmake 默认拒绝工作，需要设置 XMAKE_ROOT=y 才能正常工作
      XMAKE_ROOT: y
    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-manylinux-${{ matrix.arch }}-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # 与 release.yml 的 release-linux 保持同一套系统依赖
      - name: 配置系统依赖
        uses: ./.github/actions/setup-manylinux-deps

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: ${{ matrix.image }}
          package-cache: true
          package-cache-key: ${{ matrix.image }}
          build-cache: true
          build-cache-key: ${{ matrix.image }}

      - name: 准备 Python
        uses: ./.github/actions/setup-manylinux-python

      - name: 配置项目
        # 依赖包安装要从网络取源码并编译，卡住时必须尽快失败
        timeout-minutes: 60
        run: |
          xmake f -cy --with_test=y --check_warnings=n -m release -a ${{ matrix.arch }}
          xmake show

      - name: 恢复归档测试用例
        shell: bash
        run: cp -r test/archive/* test

      - name: 编译
        run: xmake -ay

      - name: 执行release测试
        timeout-minutes: 90
        run: |
          xmake cpdata
          xmake test --output-on-failure

      # 超长数据目录测试
      - name: 准备超长数据目录
        timeout-minutes: 15
        run: xmake run PrepareLongPathData

      # 先跑一次 --check，确认 aDataDir 等没有静默回退到默认目录
      - name: 执行超长数据目录测试
        timeout-minutes: 90
        run: |
          xmake run PrepareLongPathData --check
          xmake test --output-on-failure

      # xmake.sh（configure + make）构建冒烟测试，源码自解压包安装时走的就是这条路径。
      # 用独立的 builddir，不与上面的 xmake 构建目录冲突。
      - name: 测试 xmake.sh 编译
        timeout-minutes: 60
        run: |
          ./scripts/xpack/runself.sh --builddir=build-xsh
          rm -rf build-xsh
