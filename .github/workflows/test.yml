name: 测试

on:
  push:
    branches:
      - 'ci/python-diag'
  workflow_dispatch:

jobs:
  test:
    # 复刻 编译 工作流的 build-linux(manylinux_2_28_x86_64) 腿，只保留到跑测试为止：
    # 打包 / ABI 门槛 / xmake.sh / 产物上传都跟定位 testPythonExecutor 无关，删掉省时间。
    # 缓存 key 与 build.yml 保持一致，好命中已有的编译缓存，不用从头编。
    runs-on: ubuntu-22.04
    container:
      image: quay.io/pypa/manylinux_2_28_x86_64
    defaults:
      run:
        shell: bash
    env:
      XMAKE_ROOT: y
    concurrency:
      group: ${{ github.ref }}-python-diag
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: 配置系统依赖
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            zip unzip xz tar which git curl wget \
            binutils make pkgconf-pkg-config \
            mesa-libGL-devel mesa-libGLU-devel \
            libX11-devel libXext-devel libXrender-devel libXrandr-devel libXfixes-devel \
            libXi-devel libXcursor-devel libXinerama-devel libXScrnSaver-devel \
            libxcb-devel libxkbcommon-devel libxkbcommon-x11-devel \
            fontconfig-devel freetype-devel libpng-devel \
            glib2-devel dbus-devel alsa-lib-devel libSM-devel libICE-devel \
            openssl-devel

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev

      - name: 配置依赖缓存
        uses: actions/cache@v4
        with:
          path: xmake-cache
          key: xmake-deps-manylinux_2_28_x86_64-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-v1

      - name: 配置编译缓存
        uses: actions/cache@v4
        with:
          path: |
            build
            .xmake
          key: xmake-build-manylinux_2_28_x86_64-v1-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-${{ github.sha }}
          restore-keys: |
            xmake-build-manylinux_2_28_x86_64-v1-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-

      - name: 设置xmake相关目录
        run: |
          xmake g --pkg_cachedir="$(pwd)/xmake-cache/cache"
          xmake g --pkg_installdir="$(pwd)/xmake-cache/packages"
          xmake repo -u

      - name: 准备 Python
        run: |
          pybin="$(ls -d /opt/python/cp3*/bin 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$pybin" ]; then
            echo "::error::容器里找不到 /opt/python/cp3*/bin"
            exit 1
          fi
          echo "$pybin" >> "$GITHUB_PATH"
          "$pybin/python3" --version

      - name: 配置Qt环境
        run: |
          xrepo install -y aqt
          xrepo info aqt
          xmake require -y qt

      - name: 配置release版本
        run: |
          xmake f -cy --with_test=y -m release -a x86_64
          xmake show

      - name: 编译
        run: |
          xmake -ay

      - name: 先看动态链接器眼里的 python
        run: |
          echo "===== 产物的 RPATH/RUNPATH ====="
          readelf -d build/linux/x86_64/release/testPythonExecutor 2>/dev/null \
            | grep -iE 'rpath|runpath' || echo "(没有 RPATH/RUNPATH)"
          echo "===== 各库自己的 RUNPATH ====="
          for so in build/linux/x86_64/release/libAstScript.so \
                    build/linux/x86_64/release/libAstUtil.so; do
            echo "--- $so"
            readelf -d "$so" 2>/dev/null | grep -iE 'rpath|runpath' || echo "  (没有)"
          done
          echo "===== 系统 ldconfig 认得的 libpython ====="
          ldconfig -p 2>/dev/null | grep -i libpython || echo "(无)"
          echo "===== /usr 下的 libpython*.so* ====="
          ls -l /usr/lib64/libpython* /usr/lib/libpython* 2>/dev/null || echo "(/usr 下无)"
          echo "===== 全盘找 libpython3*.so* ====="
          find / -maxdepth 7 -name 'libpython3*.so*' 2>/dev/null | head -40

      - name: 测试
        timeout-minutes: 90
        run: |
          cp -r test/Archive/* test
          xmake cpdata
          xmake test -v > "$PWD/test.out" 2>&1 || true
          echo "===== 失败清单 ====="
          grep -a -E 'Failed tests:|^ *- test[a-zA-Z]*/unittest|tests passed,' "$PWD/test.out" | tail -20
          echo "===== DIAG ====="
          sed -n '/DIAG BEGIN/,/DIAG END/p' "$PWD/test.out"
