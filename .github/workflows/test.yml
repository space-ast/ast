name: 测试

on:
  push:
    branches:
      - 'ci/asan-solar'
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        mode: [debug]
        target:
          - { runner: ubuntu-22.04-arm, arch: arm64  }
    concurrency:
      group: ${{ github.ref }}-${{ github.base_ref }}-${{ github.head_ref }}-${{ matrix.target.runner }}-${{ matrix.target.arch }}-${{ matrix.mode }}-test
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          # this is not supported, use dev branch instead
          # xmake-version: local#
          xmake-version: branch@dev

      - name: 配置依赖缓存
        uses: actions/cache@v4
        with:
          path: xmake-cache
          key: test-${{ matrix.target.runner }}-${{ matrix.target.arch }}-xmake-cache-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-v1

      - name: 配置编译缓存
        if: github.ref != 'refs/heads/master'
        uses: actions/cache@v4
        with:
          path: |
            build
            .xmake
          key: test-${{ matrix.target.runner }}-${{ matrix.target.arch }}-${{ matrix.mode }}-build-v1-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-${{ github.sha }}
          restore-keys: |
            test-${{ matrix.target.runner }}-${{ matrix.target.arch }}-${{ matrix.mode }}-build-v1-${{ hashFiles('repo/packages/**', 'thirdparty/**') }}-

      - name: 设置xmake相关目录
        run: |
          xmake g --pkg_cachedir=$(pwd)/xmake-cache/cache
          xmake g --pkg_installdir=$(pwd)/xmake-cache/packages
          xmake repo -u

      - name: 配置项目
        # 不要加 ASan：arm64 debug 的 ASan 全量构建跑出来是 exit=0 / 零报告，
        # sanitizer 的分配器把问题掩盖了。要的是原样复现 + 栈。
        run: |
          xmake f -cy --with_test=y --check_warnings=n -m ${{ matrix.mode }} -a ${{ matrix.target.arch }}
          xmake show

      - name: 准备 SWIG
        if: runner.os == 'Linux'
        run: |
          SWIG_BIN="$(find "$PWD/xmake-cache/packages/s/swig" -type f -name swig 2>/dev/null | head -1)"
          if [ -n "$SWIG_BIN" ]; then echo "$(dirname "$SWIG_BIN")" >> "$GITHUB_PATH"; fi
          echo "swig: ${SWIG_BIN:-未找到}"

      - name: 恢复归档测试用例
        shell: bash
        run: cp -r test/Archive/* test

      - name: 编译
        run: |
          xmake build testSolarSystem

      - name: 用 gdb 抓 testSolarSystem 的崩溃栈
        timeout-minutes: 40
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gdb
          xmake cpdata
          ROOT="$PWD"
          BIN_DIR="$ROOT/build/linux/arm64/${{ matrix.mode }}"
          BIN="$BIN_DIR/testSolarSystem"
          ls -la "$BIN"

          # 产物的 RUNPATH 只有 $ORIGIN:$ORIGIN/../lib，第三方包（libcspice/libmatplot 等）
          # 在 xmake-cache/packages 下，直接跑会 exit=127。把缺失的库逐个找出来补进 LD_LIBRARY_PATH
          EXTRA=""
          for lib in $(ldd "$BIN" 2>/dev/null | awk '/not found/{print $1}'); do
            d="$(find "$ROOT/xmake-cache/packages" "$BIN_DIR" -name "$lib" -printf '%h\n' 2>/dev/null | head -1)"
            [ -n "$d" ] && EXTRA="$EXTRA:$d"
          done
          export LD_LIBRARY_PATH="$BIN_DIR$EXTRA"
          echo "=== 还缺哪些库 ==="
          ldd "$BIN" | grep -i 'not found' || echo "(全部找到)"

          # 先用原样跑一次，确认不套 gdb 也能复现（否则说明是 xmake test 的调用方式有问题）
          cd "$BIN_DIR"
          set +e
          ./testSolarSystem > "$ROOT/plain.out" 2>&1
          echo "plain exit=$?"
          set -e
          tail -5 "$ROOT/plain.out"

          set +e
          gdb -batch -nx \
            -ex 'set pagination off' \
            -ex 'set confirm off' \
            -ex 'handle SIGPIPE nostop noprint pass' \
            -ex run \
            -ex 'echo \n===== BACKTRACE =====\n' \
            -ex 'bt 40' \
            -ex 'echo \n===== THREADS =====\n' \
            -ex 'thread apply all bt 12' \
            --args "$BIN" > "$ROOT/gdb.out" 2>&1
          echo "gdb exit=$?"
          set -e
          tail -c 150000 "$ROOT/gdb.out"
