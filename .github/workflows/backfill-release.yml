name: 补发 Gitee / GitCode Release

# 对Gitee / GitCode 两个镜像仓库的 release 进行补发
#
#   带宽   跨境上传实测有时只有 20–90 KB/s，存在上传失败的风险。
#
#   镜像   在 Gitee 与 GitCode 上都是「拉取镜像仓库」，镜像状态无法保证实时同步。
#          创建 release 时如果 tag 还没有同步，action-git-release 会自动创建相关 tag：
#          GitCode 平台的镜像规则会直接报错(不允许修改镜像仓库)；
#          Gitee 平台则会新建一个tag，导致与 github 上的 tag 指向的提交不同
#          所以两个平台都得等镜像把 tag 同步过来再补。
#
# 判断「缺哪些附件」这段两个平台共用的逻辑在 scripts/ci/find-release-gaps.sh 里
#
# 补发是幂等的：只补平台上还缺的附件，已经在的不会重传，定时任务多跑几次没有副作用。

on:
  schedule:
    # 每天 UTC 02:43（北京时间 10:43）。
    # GitCode的镜像自动同步大概在凌晨 1 点左右，留出小半天余量；
    # 刻意不设置为整点，GitHub 的定时任务在整点可能最拥挤。
    - cron: '43 2 * * *'
  workflow_dispatch:
    inputs:
      platform:
        description: 只补发某个平台
        type: choice
        options: [all, gitee, gitcode]
        default: all

permissions:
  contents: read # 从 GitHub Release 读说明与产物

concurrency:
  group: backfill-release
  cancel-in-progress: false # 补发很慢，别让新的一次把正在跑的流水线取消掉

jobs:
  plan:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 只要 scripts/ci/find-release-gaps.sh，不读历史也不要子模块
          fetch-depth: 1

      - name: 列出两个平台上还缺哪些附件
        id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          PLATFORM: ${{ inputs.platform || 'all' }}
        run: |
          set -euo pipefail
          matrix=$(bash scripts/ci/find-release-gaps.sh --platform "$PLATFORM")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      # 因为目前失败不会让 run 变红（设置了 continue-on-error），所以在这里记录失败信息：
      # run 页面顶部的 Summary 能直接看到，不用翻进日志找。
      - name: 记录失败信息
        if: failure()
        shell: bash
        run: |
          {
            echo "### ❌ 补发计划失败"
            echo
            echo "plan 没跑通，本次一条附件都没补。查日志里这一步的输出，"
            echo "常见原因是网络问题，或者 GITEE_TOKEN / GITCODE_TOKEN 失效。"
          } >> "$GITHUB_STEP_SUMMARY"

  backfill:
    needs: plan
    # 没有缺的附件时 plan 输出 []，整个 job 跳过。
    if: needs.plan.outputs.matrix != '' && needs.plan.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    # 跨境上传有时只有 20–90 KB/s，一个几十 MB 的附件就要十几分钟。
    # action 那边单次上限 60 分钟、最多重试 5 次，最坏情况单个文件就耗满 5 小时，
    # 所以贴着 GitHub 托管 runner 的 360 分钟上限设置超时 —— 再高会被平台直接取消。
    timeout-minutes: 355
    continue-on-error: true
    strategy:
      # 一个附件失败不该连坐其他的，剩下的继续补。
      fail-fast: false
      # 关键：串行执行，避免同时上传多个附件，导致带宽不足从而失败。
      max-parallel: 1
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 下载产物与说明
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # 一个附件一个 job, 这里一次只下一个文件
          mkdir -p assets
          gh release download "${{ matrix.tag }}" \
            -R "$GITHUB_REPOSITORY" -D assets -p "${{ matrix.file }}"
          # 正文每次都得跟着下: 下一步的 action 拿它去建/更新 release, 缺了会把正文设成空。
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${{ matrix.tag }}" \
            --jq '.body // ""' > body.md

      - name: 补发到 ${{ matrix.platform }}
        uses: space-ast/action-git-release@v1
        env:
          # 刻意不传 token 输入：留空时 action 会按 platform 回退到对应的环境变量，
          # 这里两个都给它，它按 platform 挑。
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        with:
          platform: ${{ matrix.platform }}
          repository: space-ast/ast
          tag_name: ${{ matrix.tag }}
          # 名称留空即可，action 会退回用 tag 名，与 GitHub 那边一致。
          body_path: body.md
          files: assets/*
          overwrite_files: 'true'
          fail_on_unmatched_files: 'true'

      # 一个附件传失败不会让 run 变红，这里把「哪个平台的哪个附件」等信息写进 Summary。
      # 每个失败的 matrix 分片各写一行，最后在 run 页面顶部汇总成一张清单。
      - name: 记录失败信息
        if: failure()
        shell: bash
        run: |
          {
            echo "### ❌ ${{ matrix.platform }} 补发失败"
            echo
            echo "- tag: \`${{ matrix.tag }}\`"
            echo "- 附件: \`${{ matrix.file }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
