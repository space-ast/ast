name: 覆盖率

# master 的 push 和 PR 自动跑，也可在 Actions 页面手动触发。
on:
  push:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  coverage:
    runs-on: ubuntu-latest
    # 同一分支连推多次时，取消上一次还没跑完的覆盖率任务
    concurrency:
      group: coverage-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # 覆盖率流程不读 git 历史，保持浅克隆即可；
          # 子模块要完整检出（编译需要 thirdparty，跑测试要 data）。
          submodules: true
          # lfs: true # 账号的lfs流量不够了...

      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          # this is not supported, use dev branch instead
          # xmake-version: local#
          xmake-version: branch@dev
          actions-cache-folder: '.xmake-cache'
          actions-cache-key: 'ubuntu-latest'
          package-cache: true
          package-cache-key: 'ubuntu-latest'
          build-cache: true
          build-cache-key: 'ubuntu-latest'

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: 配置opengl环境
        if: runner.os != 'Windows'
        uses: awalsh128/cache-apt-pkgs-action@v1.6.0
        with:
          packages: libgl1-mesa-dev libglu1-mesa-dev
          version: 2          

      - name: 配置Qt环境
        run: |
          xrepo install -yv aqt
          xrepo info aqt
          xmake require -yv qt

      - name: 准备 SWIG
        uses: ./.github/actions/setup-swig


      - name: 配置项目
        # 1. 复制归档测试用例到测试目录
        # 2. 配置项目
        run: |
          cp -r test/archive/* test
          xmake f -cy --with_test=y --with_examples=y --qt_sdkver=5.15.2 -m coverage
          xmake show

      - name: 编译项目
        run: |
          xmake -ay

      - name: 执行测试
        timeout-minutes: 90
        run: |
          lcov --directory . --zerocounters
          xmake cpdata
          xmake test --output-on-failure

      - name: 准备超长数据目录
        timeout-minutes: 15
        run: xmake run PrepareLongPathData

      # 先跑一次 --check，确认 aDataDir 等没有静默回退到默认目录
      - name: 执行超长数据目录测试
        timeout-minutes: 90
        run: |
          xmake run PrepareLongPathData --check
          xmake test --output-on-failure

      - name: 收集覆盖率信息
        run: |
          lcov --directory . --capture --include */src/* --output-file coverage.info 
      
      - name: 上传覆盖率到Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: space-ast/ast