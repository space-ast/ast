name: 诊断-manylinux-CA

# 临时诊断：定位 manylinux 容器里 CppHTTP 插件与 curl 命令行实现 https 校验失败的原因。
# 只跑轻量命令，不编译工程。

on:
  push:
    branches:
      - 'diag/**'
  workflow_dispatch:

jobs:
  diag:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04,     image: quay.io/pypa/manylinux_2_28_x86_64 }
          - { runner: ubuntu-22.04-arm, image: quay.io/pypa/manylinux_2_28_aarch64 }
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    env:
      XMAKE_ROOT: y
    steps:
      - uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: branch@dev

      - name: 用源码构建的 OpenSSL 3 复现
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            perl-IPC-Cmd perl-IPC-Run perl-Time-Piece make gcc gcc-c++ binutils || true
          mkdir -p /tmp/sslprobe
          cd /tmp/sslprobe
          cat > xmake.lua <<'EOF'
          add_requires("openssl3 3.6.5", {system = false, configs = {shared = true}})
          add_requires("ca-certificates 20250131")
          EOF
          xmake require -y 2>&1 | tail -5
          OPENSSL3="$(find "$HOME/.xmake/packages/o/openssl3" -type f -name openssl -path '*/bin/*' 2>/dev/null | head -1)"
          echo "OPENSSL3=$OPENSSL3"
          # 共享库版本的 openssl 可执行文件需要同包的 libssl.so.3
          export LD_LIBRARY_PATH="$(dirname "$(dirname "$OPENSSL3")")/lib:${LD_LIBRARY_PATH:-}"
          "$OPENSSL3" version -a 2>&1 | head -4
          echo
          echo "=== OpenSSL3 + SSL_CERT_FILE=certifi（即容器的默认环境） ==="
          (echo | SSL_CERT_FILE=/opt/_internal/certs.pem "$OPENSSL3" s_client \
              -connect postman-echo.com:443 -servername postman-echo.com -verify_return_error 2>&1 || true) \
            | grep -E "Verify return code|verify error|error" | head -3 || true
          echo "=== OpenSSL3 + 无 SSL_CERT_FILE ==="
          (echo | env -u SSL_CERT_FILE "$OPENSSL3" s_client \
              -connect postman-echo.com:443 -servername postman-echo.com -verify_return_error 2>&1 || true) \
            | grep -E "Verify return code|verify error|error" | head -3 || true
          echo "=== OpenSSL3 + 系统 bundle ==="
          (echo | SSL_CERT_FILE=/etc/pki/tls/certs/ca-bundle.crt "$OPENSSL3" s_client \
              -connect postman-echo.com:443 -servername postman-echo.com -verify_return_error 2>&1 || true) \
            | grep -E "Verify return code|verify error|error" | head -3 || true
          echo "=== OpenSSL3 + -CAfile certifi ==="
          (echo | "$OPENSSL3" s_client -CAfile /opt/_internal/certs.pem \
              -connect postman-echo.com:443 -servername postman-echo.com -verify_return_error 2>&1 || true) \
            | grep -E "Verify return code|verify error|error" | head -3 || true
          echo "=== OpenSSL3 + -CAfile 系统 bundle ==="
          (echo | "$OPENSSL3" s_client -CAfile /etc/pki/tls/certs/ca-bundle.crt \
              -connect postman-echo.com:443 -servername postman-echo.com -verify_return_error 2>&1 || true) \
            | grep -E "Verify return code|verify error|error" | head -3 || true

      - name: 用 httplib + OpenSSL3 复现插件行为
        run: |
          dnf install -y --setopt=install_weak_deps=False gcc-c++ make || true
          mkdir -p /tmp/hprobe
          cd /tmp/hprobe
          curl -fsSL --max-time 60 -o httplib.h \
            https://raw.githubusercontent.com/yhirose/cpp-httplib/v0.63.0/httplib.h
          cat > probe.cpp <<'EOF'
          #include "httplib.h"
          #include <cstdio>
          #include <cstdlib>
          int main() {
              const char* f = std::getenv("SSL_CERT_FILE");
              const char* d = std::getenv("SSL_CERT_DIR");
              std::printf("SSL_CERT_FILE=[%s]\n", f ? f : "(null)");
              std::printf("SSL_CERT_DIR=[%s]\n", d ? d : "(null)");
              httplib::Client cli("https://postman-echo.com");
              auto res = cli.Get("/get");
              if (res) {
                  std::printf("RESULT: http=%d body=%u\n", res->status,
                              (unsigned)res->body.size());
              } else {
                  std::printf("RESULT: error=%s (%d)\n",
                              httplib::to_string(res.error()).c_str(),
                              (int)res.error());
              }
              return 0;
          }
          EOF
          SSL3DIR="$(dirname "$(dirname "$(find "$HOME/.xmake/packages/o/openssl3" -type f -name openssl -path '*/bin/*' | head -1)")")"
          echo "SSL3DIR=$SSL3DIR"
          g++ -std=c++11 -DCPPHTTPLIB_OPENSSL_SUPPORT -DCPPHTTPLIB_NO_EXCEPTIONS \
            -I"$SSL3DIR/include" -I. probe.cpp -o probe \
            -L"$SSL3DIR/lib" -lssl -lcrypto -lpthread -ldl -Wl,-rpath,"$SSL3DIR/lib"
          CACERT="$(find "$HOME/.xmake/packages/c/ca-certificates" -name cacert.pem 2>/dev/null | head -1 || true)"
          if [ -z "$CACERT" ]; then
            CACERT=/opt/_internal/certs.pem
          fi
          CACERTDIR="$(dirname "$CACERT")"
          echo "CACERT=$CACERT"
          run() { echo "--- $1"; shift; ( eval "$@" ./probe ) 2>&1 | tail -3; }
          run "容器默认环境（SSL_CERT_FILE=certifi）"          ""
          run "清掉 SSL_CERT_FILE"                              "env -u SSL_CERT_FILE"
          run "SSL_CERT_FILE=系统 bundle"                       "env SSL_CERT_FILE=/etc/pki/tls/certs/ca-bundle.crt"
          run "SSL_CERT_FILE=certifi + SSL_CERT_DIR=xmake 包目录" \
              "env SSL_CERT_FILE=/opt/_internal/certs.pem SSL_CERT_DIR=$CACERTDIR"
          run "SSL_CERT_FILE=xmake cacert（ca-certificates 包的 env）" \
              "env SSL_CERT_FILE=$CACERT SSL_CERT_DIR=$CACERTDIR"

      - name: CA 与环境诊断
        run: |
          echo "=== 系统与时间 ==="
          head -3 /etc/os-release || true
          date -u
          echo
          echo "=== 关键环境变量 ==="
          env | grep -i -E '^(SSL_|CURL_|LD_LIBRARY|PATH=)' || true
          echo
          echo "=== CA 候选文件 ==="
          for f in "$SSL_CERT_FILE" /opt/_internal/vendor/certifi/cacert.pem \
                   /etc/pki/tls/certs/ca-bundle.crt /etc/pki/tls/cert.pem \
                   /etc/ssl/certs/ca-certificates.crt /etc/ssl/cert.pem; do
            [ -n "$f" ] || continue
            if [ -e "$f" ]; then
              real="$(readlink -f "$f" 2>/dev/null || true)"
              echo "EXISTS $f -> ${real:-<readlink failed>}"
              if [ -f "$real" ]; then
                echo "  size=$(wc -c < "$real") certs=$(grep -c 'BEGIN CERTIFICATE' "$real" 2>/dev/null || echo '?')"
              else
                echo "  不是普通文件（悬空符号链接？）"
              fi
            else
              echo "MISSING $f"
            fi
          done
          echo
          echo "=== 系统 openssl ==="
          openssl version -a 2>&1 | head -6
          rpm -q ca-certificates openssl-libs 2>/dev/null || true
          echo
          echo "=== DNS ==="
          getent hosts postman-echo.com || true
          echo
          echo "=== 握手（默认环境，即插件看到的环境） ==="
          (echo | timeout 30 openssl s_client -connect postman-echo.com:443 \
              -servername postman-echo.com -verify_return_error 2>&1 || true) \
            | grep -E "Verify return code|verify error|CONNECTED|error" | head -6 || true
          echo
          echo "=== 握手（清掉 SSL_CERT_FILE） ==="
          (env -u SSL_CERT_FILE bash -c 'echo | timeout 30 openssl s_client -connect postman-echo.com:443 -servername postman-echo.com -verify_return_error 2>&1' || true) \
            | grep -E "Verify return code|verify error|CONNECTED|error" | head -6 || true
          echo
          echo "=== 握手（SSL_CERT_FILE 指向系统 bundle） ==="
          (SSL_CERT_FILE=/etc/pki/tls/certs/ca-bundle.crt timeout 30 bash -c 'echo | openssl s_client -connect postman-echo.com:443 -servername postman-echo.com -verify_return_error 2>&1' || true) \
            | grep -E "Verify return code|verify error|CONNECTED|error" | head -6 || true
          echo
          echo "=== curl（默认环境） ==="
          curl -sS --max-time 30 -o /dev/null -w 'http=%{http_code} rc=%{exitcode}\n' https://postman-echo.com/get || echo "curl exit=$?"
          echo "=== curl（清掉 SSL_CERT_FILE） ==="
          env -u SSL_CERT_FILE curl -sS --max-time 30 -o /dev/null -w 'http=%{http_code} rc=%{exitcode}\n' https://postman-echo.com/get || echo "curl exit=$?"
          echo "=== curl（CURL_CA_BUNDLE=系统 bundle） ==="
          CURL_CA_BUNDLE=/etc/pki/tls/certs/ca-bundle.crt curl -sS --max-time 30 -o /dev/null -w 'http=%{http_code} rc=%{exitcode}\n' https://postman-echo.com/get || echo "curl exit=$?"
          echo
          echo "=== 复现测试里的那行 curl ==="
          timeout 30 curl -s -S -i -L -N "https://postman-echo.com/get?foo1=10&foo2=20" 2>&1 | head -8 || echo "curl exit=$?"
          echo
          echo "=== curl --version ==="
          curl --version | head -3
