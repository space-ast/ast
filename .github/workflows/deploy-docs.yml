
name: 部署文档

on:
  push:
    branches:
      - master
      - dev

permissions:
  contents: write

jobs:
  deploy-gh-pages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 主仓库不读 git 历史：Doxygen 只看 src/、INCLUDE_PATH 是 include，
          # VuePress 的 importCode 只映射 /examples 和 /src。
          fetch-depth: 1
          # submodules: true 会把 thirdparty/* 和 data（139 MB）一起拉下来，本流程一个都用不到
          submodules: false

      # theme-hope 默认启用 @vuepress/plugin-git（lastUpdated / contributors），
      # 它是对 docs 目录跑 git log，所以 docs 的历史要完整拉下来
      - name: 检出文档子模块
        run: git submodule update --init docs

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: 安装依赖
        run: |
          corepack enable
          npm ci
        working-directory: docs

      - name: 构建文档
        env:
          NODE_OPTIONS: --max_old_space_size=8192
        run: |-
          npm run docs:build
          > .vuepress/dist/.nojekyll
        working-directory: docs

      - name: 构建 Doxygen 文档
        uses: mattnotmitt/doxygen-action@v1.12.0
        with:
          working-directory: '.'
          doxyfile-path: './doxyfile'

      - name: 复制文档
        run: |
          cp -r build/html docs/.vuepress/dist/api

      - name: 部署文档
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          # 部署文档
          branch: gh-pages
          folder: docs/.vuepress/dist
